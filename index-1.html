<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QolSpeak AI</title><style> *{box-sizing:border-box}body{margin:0;background:#edf5fa;color:#17374b;font:16px system-ui}main{max-width:1000px;margin:auto;padding:16px}header,section{background:white;border-radius:20px;padding:18px;margin-bottom:14px}h1{margin:0;color:#12638b}small{color:#536b7a}canvas{width:100%;background:#dce9f0;border-radius:14px;display:block}button,select,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #b5d2e1;background:white;color:#17374b;max-width:100%}button{cursor:pointer;background:#176c96;color:white}button:disabled{opacity:.5}.grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}#sub{background:#174761;color:white;padding:24px;text-align:center;border-radius:14px;font-size:clamp(24px,5vw,48px);font-weight:bold}#status{min-height:45px}video{display:none}</style><main><header><h1>QolSpeak AI</h1><small>Инклюзивті коммуникация • нақты қол қимылын тану</small></header><section><video id="v" playsinline muted></video><canvas id="c" width="640" height="480"></canvas><p id="status">Камераны қосыңыз. HTTPS қажет.</p><div id="sub">Ымды көрсетіңіз</div><div class="grid"><button id="start">Камераны қосу</button><button id="stop">Тоқтату</button><button id="full">Толық экран</button><button id="say">Дыбыстау</button></div></section><section><h2>Ымдарды үйрету</h2><select id="label"></select><div class="grid"><input id="newlabel" placeholder="Жаңа ым атауы"><button id="add">Қосу</button></div><div class="grid"><button id="record">Үлгі жазу (2 секунд)</button><button id="train">Модельді үйрету</button><button id="recognize">Тануды бастау</button><button id="export">Деректерді сақтау</button><label>Деректерді ашу <input type="file" id="import" accept=".json"></label></div><p id="counts"></p><small>Әр ымға кемінде 10, жақсырақ 50 үлгі жинаңыз. «Басқа қимыл» класын да үйретіңіз. Ым атаулары дайын, бірақ үлгілер алдын ала үйретілмеген.</small></section></main><script type="module">
const $=id=>document.getElementById(id), labels=['Сәлеметсіз бе!','Рақмет!','Иә','Жоқ','Маған көмектесіңізші','Су керек','Дәрігер керек','Менің ауырған жерім бар','Келесі аялдамадан түсемін','Бағасы қанша?','Түсінбедім','Дәретхана қайда?','Басқа қимыл'];let data={},model=[],landmarker,stream,running=false,recognizing=false,recording=null,seq=[],last=0,lastPred=0,history=[],hold=0;const status=s=>$('status').textContent=s;try{data=JSON.parse(localStorage.getItem('qol-data')||'{}')}catch{}function refresh(){let old=$('label').value;$('label').replaceChildren(...[...new Set([...labels,...Object.keys(data)])].map(x=>new Option(x,x)));if(old)$('label').value=old;$('counts').textContent=Object.entries(data).map(([k,v])=>k+': '+v.length).join(' • ')||'Үлгілер әлі жоқ'}refresh();function save(){try{localStorage.setItem('qol-data',JSON.stringify(data))}catch{status('Жад толды. Деректерді файлға сақтаңыз.')}}$('add').onclick=()=>{let x=$('newlabel').value.trim();if(x){data[x]??=[];refresh();$('label').value=x;save()}};
$('start').onclick=async()=>{if(running)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Сайтты HTTPS арқылы ашыңыз');status('AI жүктелуде...');if(!landmarker){const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');const f=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');landmarker=await m.HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2})}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('v').srcObject=stream;await $('v').play();running=true;status('Камера қосылды');requestAnimationFrame(loop)}catch(e){stream?.getTracks().forEach(t=>t.stop());status('Қате: '+e.message)}};
$('stop').onclick=()=>{running=false;recognizing=false;recording=null;seq=[];stream?.getTracks().forEach(t=>t.stop());status('Камера тоқтатылды')};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>status('Браузер толық экранды қолдамайды'))};$('say').onclick=()=>{let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('kk'));if(!voice){status('Қазақша дауыс құрылғыда орнатылмаған');return}let u=new SpeechSynthesisUtterance($('sub').textContent);u.voice=voice;u.lang='kk-KZ';speechSynthesis.speak(u)};
function feature(r){let a=Array(128).fill(0);r.landmarks.forEach((p,i)=>{let j=r.handedness[i][0].categoryName==='Left'?0:64;let s=Math.max(.04,Math.hypot(p[9].x-p[0].x,p[9].y-p[0].y));p.forEach((q,k)=>{a[j+k*3]=(q.x-p[0].x)/s;a[j+k*3+1]=(q.y-p[0].y)/s;a[j+k*3+2]=(q.z-p[0].z)/s});a[j+63]=1});return a}function vector(s){return s.flat()}function dist(a,b){let d=0;for(let i=0;i<a.length;i++)d+=(a[i]-b[i])**2;return d/a.length}function predict(){let a=vector(seq),near=model.map(x=>[dist(a,x.v),x.k]).sort((a,b)=>a[0]-b[0]).slice(0,3);if(!near.length)return;let k=near[0][1];if(near.every(x=>x[1]===k)&&near[0][0]<.18&&k!=='Басқа қимыл'){history.push(k);if(history.length>3)history.shift();if(history.length===3&&history.every(x=>x===k)){$('sub').textContent=k;hold=performance.now()}}else history=[]}
function loop(t){if(!running)return;requestAnimationFrame(loop);if(t-last<100||$('v').readyState<2)return;last=t;let c=$('c'),ctx=c.getContext('2d');ctx.save();ctx.translate(c.width,0);ctx.scale(-1,1);ctx.drawImage($('v'),0,0,c.width,c.height);let r;try{r=landmarker.detectForVideo($('v'),t)}catch(e){ctx.restore();status(e.message);return}for(let p of r.landmarks){ctx.fillStyle='#00dfb1';for(let q of p){ctx.beginPath();ctx.arc(q.x*c.width,q.y*c.height,4,0,Math.PI*2);ctx.fill()}}ctx.restore();let f=feature(r);if(recording){if(t<recording.begin){status('Дайындалыңыз: '+Math.ceil((recording.begin-t)/1000));return}recording.s.push(f);status('Жазылуда: '+recording.s.length+'/20');if(recording.s.length===20){let {k,s}=recording;recording=null;if(!s.some(x=>x[63]||x[127])){status('Қол көрінбеді. Қайта жазыңыз');return}(data[k]??=[]).push(vector(s));refresh();save();status('Үлгі сақталды: '+k)}}else if(recognizing){seq.push(f);if(seq.length>20)seq.shift();if(seq.length===20&&t-lastPred>300){lastPred=t;if(r.landmarks.length)predict();else history=[]}if(t-hold>3500)$('sub').textContent='Ымды көрсетіңіз'}}
$('record').onclick=()=>{if(!running)return status('Алдымен камераны қосыңыз');if(recording)return;recognizing=false;recording={k:$('label').value,s:[],begin:performance.now()+2000}};$('train').onclick=()=>{let entries=Object.entries(data).filter(([k,v])=>v.length>0);if(entries.length<2)return status('Кемінде екі ымға үлгі қажет');model=entries.flatMap(([k,v])=>v.map(v=>({k,v})));status('Модель дайын: '+entries.length+' класс. Тануды бастаңыз')};$('recognize').onclick=()=>{if(!running)return status('Алдымен камераны қосыңыз');if(!model.length){$('train').click();if(!model.length)return;}recording=null;seq=[];history=[];recognizing=true;status('Тану жүріп жатыр')};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='qolspeak-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Object.values(d).every(v=>Array.isArray(v)&&v.every(a=>Array.isArray(a)&&a.length===2560&&a.every(Number.isFinite))))throw Error('Формат сәйкес емес');data=d;model=[];recognizing=false;save();refresh();status('Деректер ашылды')}catch(e){status(e.message)}};
</script></html>
